services:
  mysql:
    image: mysql:latest
    container_name: mysql_db
    ports:
      - '3306:3306'
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - ./data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASS}" ]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    container_name: backend
    build:
      context: .
      dockerfile: deploy/Dockerfile
    ports:
      - '3000:3000'
    environment:
      DB_HOST: mysql
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
